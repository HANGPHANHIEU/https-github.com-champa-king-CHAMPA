<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - Việc Gấp Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Admin -->
    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-shield-halved text-teal-400 text-xl"></i>
            <span class="font-bold text-lg tracking-tight">Hệ Thống Phê Duyệt - Việc Gấp Admin</span>
        </div>
        <div class="flex items-center gap-3">
            <button id="btnLogout" class="hidden bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
            </button>
            <!-- Nút quay lại trang chủ -->
            <a href="index.html" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center shadow-sm">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> Về trang người dùng
            </a>
        </div>
    </header>

    <!-- FORM ĐĂNG NHẬP ADMIN -->
    <div id="adminLoginForm" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-100 p-6 space-y-5">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-slate-900 text-teal-400 rounded-2xl flex items-center justify-center text-xl mx-auto mb-2">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-900">Xác thực Quản trị viên</h2>
                <p class="text-xs text-slate-500">Nhập mật khẩu admin để quản lý & phê duyệt</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu Admin</label>
                    <input type="password" id="adminPasswordInput" required placeholder="Nhập mật khẩu..." class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
                </div>
                <p id="loginErrorMsg" class="text-xs text-red-500 font-semibold hidden text-center"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Mật khẩu không chính xác!</p>
                <button type="submit" class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl transition text-sm shadow-sm">
                    Đăng nhập hệ thống
                </button>
            </form>
            <p class="text-[11px] text-center text-slate-400">Mật khẩu mặc định: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-slate-700 font-bold">admin123</code></p>
        </div>
    </div>

    <!-- NỘI DUNG QUẢN TRỊ (Hiện ra sau khi nhập đúng mật khẩu admin123) -->
    <main id="adminMainContent" class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6 hidden">
        
        <!-- Thống kê nhanh -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-semibold uppercase">Hồ sơ cá nhân chờ duyệt</p>
                    <h3 id="statPendingWorkers" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-user-clock"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-semibold uppercase">Tổ chức chờ duyệt</p>
                    <h3 id="statPendingOrgs" class="text-2xl font-bold text-blue-600 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-building-circle-exclamation"></i>
                </div>
            </div>
        </div>

        <!-- Bảng phê duyệt Cá nhân -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50">
                <h3 class="font-bold text-slate-900"><i class="fa-solid fa-user-check mr-2 text-amber-500"></i> Phê duyệt Hồ sơ Cá nhân</h3>
            </div>
            <div id="adminPendingWorkerList" class="p-4 space-y-3">
                <!-- JS render danh sách ở đây -->
            </div>
        </div>

        <!-- Bảng phê duyệt Tổ chức -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 bg-slate-50">
                <h3 class="font-bold text-slate-900"><i class="fa-solid fa-building-shield mr-2 text-blue-600"></i> Phê duyệt Tổ chức / Đối tác</h3>
            </div>
            <div id="adminPendingOrgList" class="p-4 space-y-3">
                <!-- JS render danh sách ở đây -->
            </div>
        </div>

    </main>

    <!-- File JS dùng chung -->
    <script src="script.js"></script>
</body>
</html>
