<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị Hệ Thống - Việc Gấp Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Admin -->
    <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-shield-halved text-teal-400 text-xl"></i>
            <span class="font-bold text-lg tracking-tight">Hệ Thống Quản Trị -ệc Gấp Admin</span>
        </div>
        <a href="index.html" class="bg-teal-600 hover:bg-teal-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition flex items-center shadow-sm">
            <i class="fa-solid fa-arrow-left mr-1.5"></i> Về trang người dùng
        </a>
    </header>

    <!-- Nội dung chính Admin -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-6 space-y-6">
        
        <!-- Thống kê nhanh -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-semibold uppercase">Tổng việc làm</p>
                    <h3 id="statTotalJobs" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-teal-50 text-teal-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-semibold uppercase">Cá nhân đăng ký</p>
                    <h3 id="statTotalWorkers" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-users"></i>
                </div>
            </div>

            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-500 font-semibold uppercase">Tổ chức đối tác</p>
                    <h3 id="statTotalOrgs" class="text-2xl font-bold text-slate-900 mt-1">0</h3>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-building"></i>
                </div>
            </div>
        </div>

        <!-- Quản lý Việc làm -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-900"><i class="fa-solid fa-list-check mr-2 text-teal-600"></i> Quản lý Danh sách Công việc</h3>
                <span id="badgeJobsCount" class="text-xs bg-teal-100 text-teal-800 font-semibold px-2.5 py-1 rounded-full">0 việc</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50/70 border-b border-slate-200 text-xs text-slate-500 uppercase">
                            <th class="p-4">Tên công việc</th>
                            <th class="p-4">Khu vực</th>
                            <th class="p-4">Mức lương</th>
                            <th class="p-4">Liên hệ</th>
                            <th class="p-4 text-center">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="adminJobList" class="divide-y divide-slate-100">
                        <!-- Dữ liệu render bằng JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Quản lý Cá nhân & Tổ chức -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Danh sách cá nhân -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 border-b border-slate-100 bg-slate-50">
                    <h3 class="font-bold text-slate-900"><i class="fa-solid fa-user-shield mr-2 text-amber-500"></i> Hồ sơ Cá nhân đăng ký</h3>
                </div>
                <div id="adminWorkerList" class="p-4 space-y-3 max-h-96 overflow-y-auto">
                    <!-- Render bằng JS -->
                </div>
            </div>

            <!-- Danh sách tổ chức -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-5 border-b border-slate-100 bg-slate-50">
                    <h3 class="font-bold text-slate-900"><i class="fa-solid fa-building-shield mr-2 text-blue-600"></i> Doanh nghiệp & Tổ chức</h3>
                </div>
                <div id="adminOrgList" class="p-4 space-y-3 max-h-96 overflow-y-auto">
                    <!-- Render bằng JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Script điều khiển chung -->
    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
