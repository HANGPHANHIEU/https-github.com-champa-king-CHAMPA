<!-- MODAL ĐĂNG NHẬP / ĐĂNG KÝ THÀNH VIÊN -->
<div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl border border-slate-100 p-6 space-y-4">
        <!-- Header Modal -->
        <div class="flex justify-between items-center pb-2 border-b border-slate-100">
            <h3 id="authTitle" class="font-bold text-slate-900 text-lg">Đăng nhập tài khoản</h3>
            <button id="btnCloseAuthModal" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
        </div>

        <!-- Form Đăng nhập -->
        <form id="loginForm" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Số điện thoại</label>
                <input type="tel" id="loginPhone" required placeholder="0901234567" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
            </div>
            <button type="submit" class="w-full py-2.5 bg-[#0d9488] hover:bg-teal-700 text-white font-medium rounded-xl text-sm transition shadow-sm">
                Đăng nhập ngay
            </button>
            <p class="text-xs text-center text-slate-500 pt-2">
                Chưa có tài khoản? <a href="#" id="switchToRegister" class="text-teal-600 font-bold hover:underline">Đăng ký ngay</a>
            </p>
        </form>

        <!-- Form Đăng ký -->
        <form id="registerForm" class="space-y-3 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Họ và tên</label>
                <input type="text" id="regName" required placeholder="Nguyễn Văn A" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Số điện thoại</label>
                <input type="tel" id="regPhone" required placeholder="0901234567" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
                <input type="password" id="regPassword" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
            </div>
            <button type="submit" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-xl text-sm transition shadow-sm">
                Tạo tài khoản
            </button>
            <p class="text-xs text-center text-slate-500 pt-2">
                Đã có tài khoản? <a href="#" id="switchToLogin" class="text-teal-600 font-bold hover:underline">Đăng nhập</a>
            </p>
        </form>
    </div>
</div>
