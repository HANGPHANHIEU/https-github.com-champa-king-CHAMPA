<!-- Container danh sách công việc -->
<div id="jobList" class="space-y-4">
    <!-- Danh sách việc làm sẽ tự động hiển thị ở đây -->
</div>

<!-- MODAL ĐĂNG VIỆC TỰ ĐỘNG HIỆN KHI BẤM "ĐĂNG VIỆC GẤP" -->
<div id="postJobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-md rounded-xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <h3 class="font-bold text-slate-800 text-lg">Đăng công việc mới</h3>
            <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
        </div>
        
        <form id="postJobForm" class="p-5 space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Tên công việc <span class="text-red-500">*</span></label>
                <input type="text" id="jobTitleInput" required placeholder="Ví dụ: Nhân viên Bán hàng, Lập trình viên..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Khu vực</label>
                    <select id="jobLocationInput" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
                        <option value="Hà Nội">Hà Nội</option>
                        <option value="TP.HCM">TP.HCM</option>
                        <option value="Đà Nẵng">Đà Nẵng</option>
                        <option value="Toàn quốc">Toàn quốc</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mức lương</label>
                    <input type="text" id="jobSalaryInput" placeholder="Ví dụ: 10 - 15 triệu" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900">
                </div>
            </div>

            <div class="flex items-center gap-2 pt-1">
                <input type="checkbox" id="jobUrgentInput" class="w-4 h-4 text-slate-900 rounded border-slate-300 focus:ring-slate-900">
                <label for="jobUrgentInput" class="text-sm font-medium text-slate-700 cursor-pointer">Cần tuyển gấp (Gắn nhãn GẤP)</label>
            </div>

            <div class="pt-3 flex gap-2">
                <button type="button" id="btnCancelModal" class="w-1/2 py-2.5 bg-slate-100 text-slate-700 font-medium rounded-lg hover:bg-slate-200 transition">Hủy</button>
                <button type="submit" class="w-1/2 py-2.5 bg-slate-900 text-white font-medium rounded-lg hover:bg-slate-800 transition shadow-sm">Đăng ngay</button>
            </div>
        </form>
    </div>
</div>
