<!-- NÚT BẤM CHUYỂN ĐỔI NGÔN NGỮ (VIỆT - ANH) -->
<button type="button" id="btnToggleLangWidget" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer border border-slate-300">
    <i class="fa-solid fa-globe text-teal-600"></i> 
    <span id="langBtnText">EN</span>
</button>

<script>
(function() {
    // Bộ từ điển song ngữ rút gọn trực tiếp
    const dict = {
        vi: {
            appTitle: "Việc Gấp",
            commissionText: "Hoa hồng 1%",
            manageWorkersText: "Quản lý nhận việc",
            authBtnText: "Đăng ký / Đăng nhập",
            heroTitle: "Cần thợ gấp? Hoặc tìm việc làm ngay trong ngày?",
            heroDesc: "Nền tảng kết nối trực tiếp người cần thuê và người nhận việc an toàn, bảo mật và minh bạch.",
            postJobNow: "Đăng việc ngay",
            tabJobList: "Bảng tin việc làm",
            tabAcceptedJob: "Việc đã nhận",
            tabOrg: "Tổ chức/Đối tác",
            tabWorker: "Hồ sơ thợ",
            filterLoc: "Lọc nhanh theo khu vực:",
            allLoc: "Tất cả khu vực",
            btnAcceptJob: "Nhận việc",
            deleteBtn: "Xóa"
        },
        en: {
            appTitle: "Quick Jobs",
            commissionText: "1% Commission",
            manageWorkersText: "Manage Workers",
            authBtnText: "Register / Login",
            heroTitle: "Need workers fast? Or looking for daily jobs?",
            heroDesc: "Direct platform connecting hirers and job seekers safely, securely, and transparently.",
            postJobNow: "Post Job Now",
            tabJobList: "Job Feed",
            tabAcceptedJob: "Accepted Jobs",
            tabOrg: "Organizations",
            tabWorker: "Workers Profile",
            filterLoc: "Filter by location:",
            allLoc: "All Locations",
            btnAcceptJob: "Accept Job",
            deleteBtn: "Delete"
        }
    };

    let currentLang = localStorage.getItem('app_language') || 'vi';

    function applyLang(lang) {
        currentLang = lang;
        localStorage.setItem('app_language', lang);
        
        const btnText = document.getElementById('langBtnText');
        if (btnText) btnText.textContent = lang === 'vi' ? 'EN' : 'VN';

        // 1. Dịch các thẻ có data-i18n
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[lang] && dict[lang][key]) {
                el.textContent = dict[lang][key];
            }
        });

        // 2. Dịch trực tiếp các nút Nhận việc và Xóa trong danh sách
        document.querySelectorAll('#jobList button').forEach(btn => {
            if (lang === 'en') {
                if (btn.innerText.includes('Nhận việc')) btn.innerHTML = 'Accept Job &rarr;';
                if (btn.innerText.includes('Xóa')) btn.innerHTML = '<i class="fa-solid fa-trash-can mr-1"></i>Delete';
            } else {
                if (btn.innerText.includes('Accept Job')) btn.innerHTML = 'Nhận việc &rarr;';
                if (btn.innerText.includes('Delete')) btn.innerHTML = '<i class="fa-solid fa-trash-can mr-1"></i>Xóa';
            }
        });
    }

    // Gắn sự kiện click trực tiếp vào nút bấm
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('#btnToggleLangWidget');
        if (btn) {
            e.preventDefault();
            const nextLang = currentLang === 'vi' ? 'en' : 'vi';
            applyLang(nextLang);
        }
    });

    // Chạy dịch ban đầu
    setTimeout(() => applyLang(currentLang), 300);
})();
</script>
